<!doctype html>
<!-- LAB: seção 6 do Manifesto, v1 — "Wrapped da visita". As três últimas
     linhas numa cena só, partindo da fermata da seção 5:
       "Cada linha foi escrita e posicionada exatamente assim." /
       "Você não está lendo sobre o nosso trabalho." / "Você está vivenciando."
     Ao lado, a passagem de QUEM ESTÁ LENDO, medida agora (tempo, px rolados,
     caminho do cursor, pausas) — nada inventado, nada sai do navegador; no fio
     de baixo, a forma de onda é o scroll da própria pessoa.
     A v2 (a pauta) fica em /lab/secao6/v2/.
     Só em dev: /lab/secao6/. Não entra no build. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAB — Seção 6 · v1 Wrapped</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    .w6 { --fs: clamp(28px, 3.7vw, 78px); }
    .w6-body { display: grid; grid-template-columns: minmax(0, 1fr) clamp(200px, 21vw, 340px); gap: 4vw; align-items: center; }

    /* as três frases ocupam o mesmo lugar: cada uma entra subindo da máscara e sai subindo */
    .w6-copy { position: relative; height: calc(var(--fs) * 3.1); }
    .beat { --out: 0; position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
    .l { margin: 0; font: 500 var(--fs)/.98 'Archivo', sans-serif; font-stretch: 88%; letter-spacing: -.045em; text-transform: uppercase; white-space: nowrap; }
    .l + .l { margin-top: .06em; }
    .ww { --in: 0; display: inline-block; position: relative;
      clip-path: inset(calc(var(--out) * 110%) -.3em calc((1 - var(--in)) * 110%) -.3em);
      transform: translateY(calc((1 - var(--in)) * .45em - var(--out) * .45em)); }
    /* VIVENCIANDO: letra a letra, condensada e pesada, no dobro do corpo */
    .l--big { font-size: calc(var(--fs) * 2.15); line-height: .86; font-weight: 900; font-stretch: 62%; letter-spacing: -.02em; }
    .l--big .ww:last-child { color: var(--accent); }

    /* "posicionada exatamente": a posição real (px) de cada palavra e as linhas de base */
    .guides { position: absolute; inset: 0; pointer-events: none; opacity: calc(1 - var(--out)); }
    .g-x { position: absolute; color: var(--accent); opacity: var(--g, 0); transform: translateY(calc((1 - var(--g, 0)) * 6px)); }
    .g-x::before { content: ''; position: absolute; left: 0; top: 100%; width: 1px; height: 7px; background: var(--accent); }
    .g-base { position: absolute; left: -1.5vw; right: -1.5vw; height: 0; border-top: 1px dashed rgba(255,68,56,.7);
      transform-origin: left center; transform: scaleX(var(--g, 0)); }
    .g-base span { position: absolute; left: calc(100% + 8px); top: -6px; color: var(--accent); }

    /* a passagem de quem está lendo, ao vivo */
    .w6-stats { display: flex; flex-direction: column; }
    .w6-stats .mono.st-h { margin-bottom: 10px; color: var(--paper); }
    .st { --in: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair);
      opacity: var(--in); transform: translateY(calc((1 - var(--in)) * 10px)); }
    .st:last-child { border-bottom: 1px solid var(--hair); }
    .st b { font: 500 clamp(18px, 1.7vw, 30px)/1 'Archivo', sans-serif; font-stretch: 75%; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--paper); }
    .st.is-full b { color: var(--accent); }

    /* fio de cima: gravando; fio de baixo: a forma de onda é o scroll de quem lê */
    .rec { color: var(--paper); }
    .rec i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: rec 1.1s steps(1) infinite; }
    @keyframes rec { 50% { opacity: .15; } }
    .w6-wave { flex: 1; min-width: 0; height: 44px; }
    .w6 .hint { color: var(--paper); }
    @media (prefers-reduced-motion: reduce) { .rec i { animation: none; } }
  </style>
</head>
<body>
  <script type="module" src="./main.js"></script>
</body>
</html>
