<!doctype html>
<!-- LAB da seção 3 do Manifesto — só em dev (npm run dev → /lab/secao3/).
     Protótipos de design para escolher o caminho; não entra no build. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAB — Seção 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=Ibarra+Real+Nova:wght@400;700&family=Italiana&family=JetBrains+Mono:wght@400;500&family=Nothing+You+Could+Do&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #FAFAF8; --ink: #0B0B0C; --soft: #595959; --dim: #6B6B64; --red: #FF4438; --blue: #24489a; --line: rgba(11,11,12,.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font: 13px/1.5 'JetBrains Mono', ui-monospace, monospace; }

    /* barra do LAB */
    .bar { position: fixed; inset: 0 0 auto; z-index: 100; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: rgba(250,250,248,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .bar b { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-right: 8px; }
    .bar button { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
    .bar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    .prog { position: fixed; left: 0; top: 0; height: 2px; background: var(--red); z-index: 101; width: 0; }
    .info { position: fixed; right: 16px; bottom: 16px; z-index: 100; width: min(380px, calc(100vw - 32px)); padding: 14px 16px; background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,.06); }
    .info h2 { font-size: 13px; margin-bottom: 4px; }
    .info .ref { color: var(--red); font-size: 11px; margin-bottom: 8px; }
    .info .desc { color: var(--dim); font-size: 12px; }
    .info .desc b { color: var(--ink); font-weight: 500; }
    .info.closed .desc, .info.closed .ref { display: none; }
    .info button { position: absolute; right: 8px; top: 8px; border: 0; background: none; cursor: pointer; font: inherit; color: var(--dim); }

    /* trilha de scroll + palco fixo */
    #track { position: relative; }
    .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
    .grid { position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background-image: linear-gradient(to right, rgba(11,11,12,.13) 1px, transparent 1px), linear-gradient(to bottom, rgba(11,11,12,.13) 1px, transparent 1px);
      background-size: 12.5vw 12.5vw; }
    canvas { display: block; width: 100%; height: auto; }

    /* peças comuns */
    .mark { --m: 1; position: relative; display: inline-block; isolation: isolate; padding: 0 .3em; font-family: 'Italiana', serif; line-height: 1.375; color: #000; white-space: nowrap; }
    .mark::before { content: ''; position: absolute; inset: 0; z-index: -1; background: rgba(255,68,56,.36); transform: scaleX(var(--m)); transform-origin: left; }
    .mark i, .mark u { position: absolute; top: -.23em; width: .135em; height: 1.83em; background: var(--red); opacity: min(1, calc(var(--m) * 20)); }
    .mark i { left: -.07em; clip-path: polygon(0 0, 100% 0, 100% 7%, 75% 7%, 75% 100%, 25% 100%, 25% 7%, 0 7%); }
    .mark u { left: calc(var(--m) * 100% - .07em); clip-path: polygon(25% 0, 75% 0, 75% 93%, 100% 93%, 100% 100%, 0 100%, 0 93%, 25% 93%); }
    .serif { font-family: 'Ibarra Real Nova', serif; font-weight: 700; color: var(--soft); }
    .line-in { opacity: .12; transition: opacity .5s ease, transform .5s ease; transform: translateY(.15em); }
    .line-in.on { opacity: 1; transform: none; }
    .hint { position: absolute; right: 24px; bottom: 20px; z-index: 6; font-size: 11px; color: var(--dim); }
  </style>
</head>
<body>
  <div class="prog" id="prog"></div>
  <nav class="bar" id="nav"><b>LAB · Seção 3</b><a href="./s2/" style="order:99;margin-left:auto;font-size:12px;color:var(--red)">Seção 2 → 3 (cursor 3D) ↗</a></nav>
  <div id="track"><div class="stage" id="stage"></div></div>
  <aside class="info" id="info">
    <button id="info-toggle" aria-label="Recolher">—</button>
    <h2 id="info-name"></h2>
    <p class="ref" id="info-ref"></p>
    <p class="desc" id="info-desc"></p>
  </aside>
  <script type="module" src="./main.js"></script>
</body>
</html>
