<!doctype html>
<!-- LAB de modelos da TV do Manifesto — só em dev (npm run dev → /lab/).
     Não entra no build: o vite só empacota o index.html da raiz. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAB — TV</title>
  <style>
    :root { --bg: #FAFAF8; --ink: #0B0B0C; --dim: #6B6B64; --line: rgba(11,11,12,.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font: 13px/1.5 'JetBrains Mono', ui-monospace, monospace; }
    .lab { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 100vh; }
    .stage { display: grid; place-items: center; padding: 24px; border-right: 1px solid var(--line); }
    canvas { width: min(100%, 700px); aspect-ratio: 560 / 480; display: block; }
    aside { padding: 20px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; max-height: 100vh; }
    h1 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
    h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
    .models { display: grid; gap: 4px; }
    button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; text-align: left; }
    button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    label { display: grid; grid-template-columns: 70px 1fr 56px; align-items: center; gap: 8px; }
    label output { text-align: right; color: var(--dim); }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    textarea { width: 100%; height: 110px; font: 11px/1.4 ui-monospace, monospace; padding: 6px; border: 1px solid var(--line); }
    .note { color: var(--dim); font-size: 11px; }
    @media (max-width: 900px) { .lab { grid-template-columns: 1fr; } aside { max-height: none; } }
  </style>
</head>
<body>
  <div class="lab">
    <div class="stage"><canvas id="tv"></canvas></div>
    <aside>
      <h1>LAB — TV do Manifesto</h1>
      <section><h2>Modelo</h2><div class="models" id="models"></div></section>
      <section>
        <h2>Tela MyTi</h2>
        <div class="row">
          <button id="screen-toggle" aria-pressed="true">Tela da sintonia: ligada</button>
        </div>
        <p class="note">Desligada = aparece a tela do próprio modelo.</p>
      </section>
      <section>
        <h2>Efeitos (como no scroll)</h2>
        <div class="row" style="margin-bottom:10px">
          <button id="pass">▶ Simular passagem</button>
          <button id="replay">↺ Repetir entrada</button>
        </div>
        <label>Giro <input type="range" id="turn" min="-1.6" max="0" step="0.01" value="0"><output></output></label>
        <label>Sintonia <input type="range" id="tune" min="0" max="1" step="0.01" value="1"><output></output></label>
        <label>Material <input type="range" id="boost" min="0.5" max="3" step="0.05" value="2.5"><output></output></label>
        <p class="note">Material: quanto o tv3d.js clareia o modelo (2.5 = TV atual). Recarrega o modelo.</p>
      </section>
      <section>
        <h2>Calibrar tela</h2>
        <div class="row" style="margin-bottom:10px">
          <button id="measure">Medir vidro (auto)</button>
        </div>
        <label>Frente <select id="front"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="-90">-90°</option></select><output></output></label>
        <div id="shape"></div>
        <p class="note" id="measure-note"></p>
        <textarea id="config" readonly></textarea>
      </section>
    </aside>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
